# ===========================================================================
# BBS TELNET & SSH GATEWAY CONFIGURATION (gateway.cfg)
# ===========================================================================
# This file is human-readable and shared between:
#   1. bbs_gateway.py  (Standalone Telnet & SSH Gateway + Lightbar Server)
#   2. gwconfig.mps    (Mystic BBS MPL Configuration Utility)
#
# Blank lines and lines starting with '#' or ';' are ignored when reading.
# When saved from Mystic's gwconfig.mpx, this clean layout is preserved.
# ===========================================================================

# --- General Gateway Settings ---
GATEWAY_TITLE = The Nexus BBS Telnet & SSH Gateway
SYSOP_NAME = SysOp
LISTEN_HOST = 0.0.0.0
LISTEN_PORT = 23
ANSI_FILE = gateway.ans

# --- Optional Inbound SSH Server Settings (Requires Python 'asyncssh') ---
SSH_ENABLED = FALSE
SSH_LISTEN_PORT = 2222
SSH_HOST_KEY = gateway_ssh_host_key

# DISPLAY_MODE controls what callers see upon connecting:
#   BOTH        - Display gateway.ans background/banner and overlay the lightbar menu
#   LIGHTBAR    - Render a self-contained CP437 ANSI frame with the lightbar menu
#   ANSI_HOTKEY - Display gateway.ans only and wait for hotkey selection (press L for lightbar)
DISPLAY_MODE = BOTH

# --- Lightbar Menu Geometry (79-col safe ANSI-BBS coordinates) ---
MENU_START_X = 3
MENU_START_Y = 7
MENU_WIDTH = 75
MENU_ROWS = 10

# --- Connection & Session Behavior ---
IDLE_TIMEOUT = 180
CONNECT_TIMEOUT = 15
RETURN_AFTER_DISCONNECT = TRUE

# --- DOS / Mystic Text Attributes (0-15 Foreground, 0-7 Background) ---
# Standard CGA/EGA palette:
#   0=Black, 1=Blue, 2=Green, 3=Cyan, 4=Red, 5=Magenta, 6=Brown, 7=LightGray
#   8=DarkGray, 9=LightBlue, 10=LightGreen, 11=LightCyan, 12=LightRed,
#   13=LightMagenta, 14=Yellow, 15=White
COLOR_HEADER = 15
COLOR_BORDER = 11
COLOR_ITEM_FG = 7
COLOR_ITEM_BG = 0
COLOR_HILITE_FG = 15
COLOR_HILITE_BG = 1

# ===========================================================================
# BBS DIRECTORY LISTINGS (TELNET & SSH)
# ===========================================================================
# Format:
#   BBS = Hotkey | BBS Name | Host (or user:pass@host) | Port | Mode | Description
#
# Supported Modes (Column 5):
#   LOCAL    - Local Telnet connection (e.g., 127.0.0.1 or LAN IP)
#   EXTERNAL - External Telnet connection
#   SSH-LOC  - Local SSH connection (prompts caller for login if no user@ in Host)
#   SSH-EXT  - External SSH connection (supports user@host or user:pass@host)
# ===========================================================================

BBS = 1 | Mystic Main (Telnet)   | 127.0.0.1            | 2323 | LOCAL    | Primary Mystic BBS Node (Local Telnet Port 2323)
BBS = 2 | Mystic Secure (SSH)    | 127.0.0.1            | 2222 | SSH-LOC  | Local Mystic BBS SSH Server (Prompts for Login)
BBS = 3 | Retro Door Server      | 192.168.1.50         | 2023 | LOCAL    | Local LAN Classic Door Games & TradeWars 2002
BBS = 4 | Agency BBS             | agency.bbs.nz        | 23   | EXTERNAL | Official Mystic BBS Support & FSXNet Hub (NZ)
BBS = 5 | Agency BBS (SSH)       | bbs:bbs@agency.bbs.nz| 22   | SSH-EXT  | Official Mystic BBS via Outbound SSH Tunnel
BBS = 6 | Distortion BBS         | d1st.org             | 23   | EXTERNAL | Underground ANSI Art, Mods & Cyberculture
BBS = 7 | Absinthe BBS           | absinthebbs.net      | 1940 | EXTERNAL | Amiga & Retro Computing Enthusiast Board
